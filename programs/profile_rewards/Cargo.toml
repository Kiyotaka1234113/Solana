[package]
name = "profile_rewards"
version = "0.1.0"
description = "Anchor PDA profiles with SPL token rewards"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "profile_rewards"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]

[dependencies]
anchor-lang = "=0.30.1"
anchor-spl = { version = "=0.30.1", default-features = false, features = ["token", "associated_token"] }
