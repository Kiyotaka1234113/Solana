[workspace]
members = ["programs/profile_rewards"]
exclude = ["programs/counter", "programs/profile"]
resolver = "2"

[package]
name = "solana-cli-demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solana-program = "1.18"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
